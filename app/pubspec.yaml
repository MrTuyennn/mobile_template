name: app
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  assets:
    path: ../shared/assets
  theme:
    path: ../shared/theme
  widget:
    path: ../shared/widget
  l10n:
    path: ../shared/l10n
  storage:
    path: ../shared/storage
  app_logger:
    path: ../shared/logger
  home:
    path: ../packages/home
  auth:
    path: ../packages/auth
  main:
    path: ../packages/main
  account:
    path: ../packages/account
  notification:
    path: ../packages/notification
  core:
    path: ../shared/core
  provider:
    path: ../shared/provider
  auto_route: ^11.1.0
  hooks_riverpod: ^3.1.0
  flutter_hooks:
  riverpod_annotation: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  auto_route_generator: ^10.4.0
  build_runner: ^2.10.4

flutter:
  uses-material-design: true
